<style>
:root{--ink:#111111;--muted:#4A4741;--accent:#6D47A7;--bg:#FFFFFF;--soft:#F5F4F1}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Roboto',system-ui,sans-serif;font-size:16px;line-height:1.6;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:160px 20px;position:relative;overflow:hidden;isolation:isolate}
.box{position:relative;isolation:isolate;max-width:560px;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.logo{height:40px;width:auto;color:#222020}
h1{margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-0.01em}
p{margin:0;color:var(--muted)}
a{color:var(--ink)}a:hover{color:var(--accent)}
.blob,.soft,.side{position:absolute;z-index:-1;aspect-ratio:1/1;animation:morph 14s ease-in-out infinite alternate,drift 26s ease-in-out infinite alternate}
.blob{width:320px;right:-240px;top:-140px;background:var(--accent);opacity:.9;border-radius:58% 42% 46% 54% / 50% 56% 44% 50%}
.soft{width:240px;left:-180px;bottom:-140px;background:var(--soft);border-radius:46% 54% 58% 42% / 54% 44% 56% 46%;animation-direction:alternate-reverse}
.side{border-radius:52% 48% 40% 60% / 44% 58% 42% 56%}
.side-l{width:120px;left:6vw;top:16vh;background:var(--soft);animation-duration:18s,30s}
.side-r{width:64px;right:8vw;bottom:18vh;background:var(--accent);opacity:.6;animation-duration:16s,24s;animation-direction:alternate-reverse}
@keyframes morph{0%{border-radius:58% 42% 46% 54% / 50% 56% 44% 50%}25%{border-radius:44% 56% 60% 40% / 58% 44% 56% 42%}50%{border-radius:52% 48% 38% 62% / 42% 60% 40% 58%}75%{border-radius:40% 60% 54% 46% / 56% 40% 60% 44%}100%{border-radius:56% 44% 48% 52% / 46% 54% 46% 54%}}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}33%{transform:translate(-16px,12px) rotate(8deg)}66%{transform:translate(12px,-12px) rotate(-6deg)}100%{transform:translate(-8px,-16px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.blob,.soft,.side{animation:none}}
@media (max-width:900px){.side{display:none}}
@media (max-width:640px){main{padding-left:40px;padding-right:40px}.blob{width:200px;right:-120px;top:-200px}.soft{width:160px;left:-100px;bottom:-160px}}
.timer{display:flex;align-items:flex-start;gap:4px;margin:8px 0 0 -8px}
.timer div{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.timer b{font-family:'Outfit',sans-serif;font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.timer span{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.timer i{font-family:'Outfit',sans-serif;font-style:normal;font-weight:700;font-size:40px;line-height:1;color:var(--ink)}
@media (max-width:640px){.timer b,.timer i{font-size:32px}}
footer{padding:24px 20px;font-size:14px;color:var(--muted);text-align:center}
</style>
</head>

<script>
(function(){
var target=Date.parse('2026-11-17T04:39:29+02:00');
var el={d:document.getElementById('t-d'),h:document.getElementById('t-h'),m:document.getElementById('t-m'),s:document.getElementById('t-s')};
function pad(n){return n<10?'0'+n:''+n}
function tick(){
var left=Math.max(0,Math.floor((target-Date.now())/1000));
el.d.textContent=Math.floor(left/86400);
el.h.textContent=pad(Math.floor(left%86400/3600));
el.m.textContent=pad(Math.floor(left%3600/60));
el.s.textContent=pad(left%60);
if(left===0)clearInterval(timer);
}
var timer=setInterval(tick,1000);tick();
})();
</script>
